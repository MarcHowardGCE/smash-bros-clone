<!doctype html><html lang="en"><meta charset="utf-8"><title>Bonney walking cycles</title>
<style>body{background:#172538;color:#eef1f5;font:14px system-ui;margin:30px}h1{color:#fa94bd}section{display:grid;grid-template-columns:repeat(3,250px);gap:18px}.card{background:#243950;border:1px solid #4d6478;padding:15px;border-radius:8px}.pair{height:145px;display:flex;gap:25px;align-items:center;justify-content:center}.sprite{width:96px;height:64px;background-size:576px 192px;image-rendering:pixelated;transform:scale(2);animation:stride .4s steps(6) infinite}.left{scale:-1 1}@keyframes stride{from{background-position-x:0}to{background-position-x:-576px}}p{color:#b9ceda}</style>
<h1>Bonney / six-frame walking cycles</h1><p>Contact → down → passing → opposite contact → down → passing. Left and right use the same complete cycle.</p><section id="grid"></section>
<script>for(const outfit of ['captain','egghead'])for(const [row,age]of ['Adult','Teenage','Baby'].entries()){const card=document.createElement('div');card.className='card';card.innerHTML='<h2>'+outfit+' / '+age+'</h2><div class="pair"><div class="sprite left"></div><div class="sprite"></div></div>';for(const sprite of card.querySelectorAll('.sprite')){sprite.style.backgroundImage='url('+outfit+'-walk-atlas.png)';sprite.style.backgroundPositionY=(-row*64)+'px'}document.querySelector('#grid').append(card)}</script></html>
