services:
  - type: web
    name: smash-clone
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: smash-clone
          property: port
